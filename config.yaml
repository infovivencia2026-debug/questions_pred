# Data collection
arxiv_categories: ["cs.LG", "cs.CL"]
papers_per_category_year: 1200   # per category per year
year_from: 2019
year_to: 2026
min_papers_per_author: 5       # authors with fewer papers are dropped (cold-start handled separately)

# Embedding
embedding_model: "allenai-specter"   # or "all-MiniLM-L6-v2" for a fast run

# Clustering
n_clusters: 40
clustering: "kmeans"           # kmeans | agglomerative

# Temporal split (leak-free)
train_before_year: 2024
val_year: 2024
test_from_year: 2025

# Models
seq_len: 10
hidden: 128
epochs: 15
batch_size: 64
lr: 0.001
top_k: [1, 3, 5]
seed: 42
